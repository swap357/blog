{{ define "main" }}
<header class="profile-header">
  <p class="eyebrow">{{ .Params.eyebrow | default "About" }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="profile-note">{{ . }}</p>{{ end }}
</header>
<div class="prose">{{ .Content }}</div>
{{ with .Params.links }}
<nav class="profile-links" aria-label="Elsewhere">
  {{ range . }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}
</nav>
{{ end }}
{{ end }}
