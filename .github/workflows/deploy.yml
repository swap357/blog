name: Build and deploy Hugo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: '0.166.0'
      HUGO_SHA256: '45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node for reaction tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check reactions API
        run: node --test reactions/worker.test.js

      - name: Install Hugo
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --minify --panicOnWarning

      - name: Check generated site
        run: python3 tests/check_output.py public

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
