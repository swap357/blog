{{ if and site.Params.reactions.endpoint (ne .Params.reactions false) }}
<div class="useful-feedback" data-useful data-endpoint="{{ site.Params.reactions.endpoint }}" data-article="{{ .RelPermalink }}" hidden>
  <button type="button" aria-label="Useful" aria-pressed="false" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 10H3v11h4m0-11 5-7c2 0 3 2 2 4l-1 3h6a2 2 0 0 1 2 2l-2 7a3 3 0 0 1-3 2H7V10Z"/>
    </svg>
    <span data-useful-count hidden></span>
  </button>
  <span role="status" aria-live="polite"></span>
</div>
{{ with resources.Get "js/useful.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
{{ end }}
